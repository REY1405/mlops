apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: llama-cpp-runtime
  namespace: ml

spec:
  supportedModelFormats:
    - name: gguf
      autoSelect: true

  containers:
    - name: kserve-container

      image: ghcr.io/ggml-org/llama.cpp:server

      args:
        - --host
        - 0.0.0.0
        - --port
        - "8080"
        - --model
        - /models/tinyllama.gguf

      ports:
        - containerPort: 8080

      volumeMounts:
        - name: model-volume
          mountPath: /models

  volumes:
    - name: model-volume
      persistentVolumeClaim:
        claimName: tinyllama-pvc